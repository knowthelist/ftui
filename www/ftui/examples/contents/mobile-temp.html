<ftui-view-toolbar>
  <ftui-nav-link slot="start"></ftui-nav-link>
  Temperature
</ftui-view-toolbar>

<ftui-view-sheet shape="round">
  <ftui-column gap="1em" align-items="left">
    <ftui-label bold>Air Quality</ftui-label>
    <ftui-icon name="fan" [color]="WCLuft | part(1)| step('0: green, 1000: warning, 2000: alert')" right="1em"
               top="1em"></ftui-icon>
    <ftui-row>
      <ftui-label color="medium" size="1" width="3">Bath</ftui-label>
      <ftui-label [text]="BadLuftQualitaet | toInt()" size="2" bold  unit="ppm"></ftui-label>
    </ftui-row>
    <ftui-row>
      <ftui-label color="medium" size="1" width="3">WC</ftui-label>
      <ftui-label [text]="WCLuft | toInt()" size="2" bold  unit="ppm"></ftui-label>
    </ftui-row>
  </ftui-column>
</ftui-view-sheet>

<ftui-view-section>
  <ftui-label slot="header">Rooms</ftui-label>

  <ftui-view-item>
    <ftui-label width="4em">Living</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Valve:</ftui-label>
      <ftui-label [text]="ha:climate.wz_heizung:command_value" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.wz_heizung:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>

  <ftui-view-item>
    <ftui-label width="4em">Kitchen</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Valve:</ftui-label>
      <ftui-label [text]="ha:climate.kuchen_thermostat:command_value" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.kuchen_thermostat:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>

  <ftui-view-item>
    <ftui-label width="4em">Sleep</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Valve:</ftui-label>
      <ftui-label [text]="ha:climate.schlafzimmer_heizung:command_value" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.schlafzimmer_heizung:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>

  <ftui-view-item>
    <ftui-label width="4em">Kid</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Valve:</ftui-label>
      <ftui-label [text]="ha:climate.kinderzimmer_heizung:command_value" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.kinderzimmer_heizung:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>

  <ftui-view-item>
    <ftui-label width="4em">Guest</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Valve:</ftui-label>
      <ftui-label [text]="ha:climate.gastezimmer_heizung:command_value" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.gastezimmer_heizung:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>

  <ftui-view-item>
    <ftui-label width="4em">WC</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Valve:</ftui-label>
      <ftui-label [text]="ha:climate.wc_heizung:command_value" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.wc_heizung:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>
</ftui-view-section>

<ftui-view-section>
  <ftui-label slot="header">Other</ftui-label>

  <ftui-view-item>
    <ftui-label width="4em">Cellar</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Humidity:</ftui-label>
      <ftui-label [text]="KellerClimateSensor:humidity" unit="%" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="KellerClimateSensor:temperature" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>

  <ftui-view-item>
    <ftui-label width="4em">Bath</ftui-label>
    <ftui-cell>
      <ftui-label size="80%" color="medium">Humidity:</ftui-label>
      <ftui-label [text]="ha:sensor.bad_handtuchheizung_humidity_2 | fix(0)" unit="%" color="medium"></ftui-label>
    </ftui-cell>
    <ftui-label [text]="ha:climate.bad_heizung:current_temperature | fix(1)" unit="°C" slot="end" size="1"></ftui-label>
  </ftui-view-item>
</ftui-view-section>
